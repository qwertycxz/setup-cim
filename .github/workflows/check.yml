# yaml-language-server: $schema=https://schemastore.org/github-workflow
jobs:
  check:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - if: ${{ runner.arch == 'x64' && runner.os == 'Linux' }}
        uses: pipeline-components/yamllint@041a9352496becdcf5e9d763c9456e13accfddb8
      - uses: ./
      - run: cim -V
      - uses: ./
        with:
          path: ${{ runner.temp }}/cim-v0.1.0
          revision: v0.1.0-alpha
      - run: cim -V
    strategy:
      matrix:
        os:
          - macos-26
          - macos-26-intel
          - ubuntu-24.04-arm
          - ubuntu-24.04
          - windows-11-arm
          - windows-2025
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
permissions:
  contents: read
